name: Build Cute 3D Glass Widget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Widget Project & Code
        run: |
          mkdir -p app/src/main/java/com/cute/waterwidget
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          rootProject.name = "CuteGlassWidget"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.cute.waterwidget'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cute.waterwidget"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <application
                  android:label="Cute 3D Glass"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver android:name=".WaterWidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                          <action android:name="com.cute.waterwidget.ACTION_DRINK"/>
                          <action android:name="com.cute.waterwidget.ACTION_SWITCH_BUDDY"/>
                          <action android:name="com.cute.waterwidget.ACTION_REMIND"/>
                          <action android:name="com.cute.waterwidget.ACTION_MIDNIGHT_WIPE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/widget_info.xml
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="180dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="4dp">
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"/>
              <Button
                  android:id="@+id/btn_buddy"
                  android:layout_width="80dp"
                  android:layout_height="50dp"
                  android:layout_alignParentTop="true"
                  android:layout_alignParentEnd="true"
                  android:background="@android:color/transparent"/>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/cute/waterwidget/MainActivity.kt
          package com.cute.waterwidget
          import android.app.Activity
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import android.view.Gravity
          import android.graphics.Color

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 101)
                  }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(65, 65, 65, 65)
                  }
                  val tv = TextView(this).apply {
                      text = "🦆 Cute 3D Glass Widget Installed!\n\n✨ Sounds & Haptics Active!\n\n1. Go to your Home Screen\n2. Long-press your wallpaper -> Widgets\n3. Drag 'Cute 3D Glass' to your screen!\n\n• Tap the glass for a splash sound + ice clink vibration!\n• Tap the top-right corner of the widget to swap buddies (Duck 🦆, Axolotl 🦎, Frog 🐸, Boba 🧋)!\n• Automatically resets at 12:00 AM!"
                      textSize = 17f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  layout.addView(tv)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/cute/waterwidget/WaterWidgetProvider.kt
          package com.cute.waterwidget

          import android.app.*
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.*
          import android.graphics.*
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.*
          import android.widget.RemoteViews
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.random.Random

          class WaterWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_DRINK = "com.cute.waterwidget.ACTION_DRINK"
                  const val ACTION_SWITCH_BUDDY = "com.cute.waterwidget.ACTION_SWITCH_BUDDY"
                  const val ACTION_REMIND = "com.cute.waterwidget.ACTION_REMIND"
                  const val ACTION_MIDNIGHT_WIPE = "com.cute.waterwidget.ACTION_MIDNIGHT_WIPE"
                  val BUDDIES = listOf("🦆", "🦎", "🐸", "🧋")
                  val GARNISHES = listOf("🧊", "🍓", "🍋", "🌿", "🍊", "🍒")
                  val REMINDERS = listOf(
                      "Blip blop! Your glass buddy is getting low—time for a cute sip! 💧✨",
                      "Your cells are requesting a splash! It's been 2.5 hours! 🫧",
                      "Pouty glass alert! ( ；´Д｀) Drop an ice cube and drink some water!"
                  )
              }

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  scheduleMidnightWipe(context)
                  for (id in ids) updateWidget(context, manager, id)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  val prefs = context.getSharedPreferences("CuteGlassPrefs", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

                  // Check if date changed or 12:00 AM alarm triggered
                  if (prefs.getString("date", "") != today || intent.action == ACTION_MIDNIGHT_WIPE) {
                      val savedBuddy = prefs.getInt("buddy_idx", 0)
                      prefs.edit().clear()
                          .putString("date", today)
                          .putInt("buddy_idx", savedBuddy)
                          .putBoolean("just_reset", true)
                          .apply()
                  }

                  when (intent.action) {
                      ACTION_DRINK -> {
                          val cups = prefs.getInt("cups", 0) + 1
                          val garnish = GARNISHES[Random.nextInt(GARNISHES.size)]
                          val old = prefs.getString("garnishes", "") ?: ""
                          val updated = (old.split(",") + garnish).filter { it.isNotEmpty() }.takeLast(6).joinToString(",")
                          prefs.edit()
                              .putString("date", today)
                              .putInt("cups", cups)
                              .putLong("last_sip", System.currentTimeMillis())
                              .putString("garnishes", updated)
                              .putBoolean("just_reset", false)
                              .apply()
                          playCuteHapticsAndSound(context, isGoal = (cups == 8), isBuddySwitch = false)
                          scheduleCuteReminder(context)
                          scheduleMidnightWipe(context)
                      }
                      ACTION_SWITCH_BUDDY -> {
                          val nextBuddy = (prefs.getInt("buddy_idx", 0) + 1) % BUDDIES.size
                          prefs.edit().putInt("buddy_idx", nextBuddy).apply()
                          playCuteHapticsAndSound(context, isGoal = false, isBuddySwitch = true)
                      }
                      ACTION_REMIND -> showCuteNotification(context)
                  }

                  val manager = AppWidgetManager.getInstance(context)
                  val ids = manager.getAppWidgetIds(ComponentName(context, WaterWidgetProvider::class.java))
                  for (id in ids) updateWidget(context, manager, id)
              }

              private fun playCuteHapticsAndSound(context: Context, isGoal: Boolean, isBuddySwitch: Boolean) {
                  try {
                      val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          when {
                              isBuddySwitch -> {
                                  vibrator.vibrate(VibrationEffect.createOneShot(25, 180))
                              }
                              isGoal -> {
                                  // Celebratory 3-pulse buzz for hitting 8 glasses!
                                  val timings = longArrayOf(0, 45, 65, 55, 75, 130)
                                  val amplitudes = intArrayOf(0, 170, 0, 210, 0, 255)
                                  vibrator.vibrate(VibrationEffect.createWaveform(timings, amplitudes, -1))
                              }
                              else -> {
                                  // Double-pulse: Water splash + crisp ice clink
                                  val timings = longArrayOf(0, 30, 55, 45)
                                  val amplitudes = intArrayOf(0, 130, 0, 230)
                                  vibrator.vibrate(VibrationEffect.createWaveform(timings, amplitudes, -1))
                              }
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator.vibrate(40)
                      }
                  } catch (_: Exception) {}

                  // Synthesized Cute Bubble-Pop / Chime Sound
                  try {
                      val toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 75)
                      val toneType = when {
                          isBuddySwitch -> ToneGenerator.TONE_PROP_BEEP
                          isGoal -> ToneGenerator.TONE_PROP_ACK
                          else -> ToneGenerator.TONE_PROP_BEEP2
                      }
                      toneGen.startTone(toneType, 140)
                      Handler(Looper.getMainLooper()).postDelayed({ toneGen.release() }, 250)
                  } catch (_: Exception) {}
              }

              private fun updateWidget(context: Context, manager: AppWidgetManager, widgetId: Int) {
                  val prefs = context.getSharedPreferences("CuteGlassPrefs", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())
                  if (prefs.getString("date", "") != today) {
                      val savedBuddy = prefs.getInt("buddy_idx", 0)
                      prefs.edit().clear().putString("date", today).putInt("buddy_idx", savedBuddy).putBoolean("just_reset", true).apply()
                  }

                  val cups = prefs.getInt("cups", 0)
                  val buddy = BUDDIES[prefs.getInt("buddy_idx", 0)]
                  val justReset = prefs.getBoolean("just_reset", false)
                  val lastSip = prefs.getLong("last_sip", System.currentTimeMillis())
                  val garnishes = (prefs.getString("garnishes", "") ?: "").split(",").filter { it.isNotEmpty() }
                  val hoursSince = (System.currentTimeMillis() - lastSip) / (1000.0 * 60 * 60)

                  val bmp = Bitmap.createBitmap(600, 680, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                  // 1. Time-of-Day Ambient Lighting Glow
                  val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val (glowColor, timeLabel) = when (hour) {
                      in 6..15 -> Pair(Color.argb(115, 253, 224, 71), "☀️ Sunny Glow")
                      in 16..19 -> Pair(Color.argb(125, 251, 146, 60), "🌅 Golden Hour")
                      else -> Pair(Color.argb(130, 129, 140, 248), "🌙 Midnight Glow")
                  }
                  paint.shader = RadialGradient(300f, 340f, 290f, glowColor, Color.TRANSPARENT, Shader.TileMode.CLAMP)
                  canvas.drawCircle(300f, 340f, 290f, paint)
                  paint.shader = null

                  // 2. Frosted 3D Glass Card Base
                  paint.color = Color.argb(185, 15, 23, 42)
                  canvas.drawRoundRect(RectF(40f, 30f, 560f, 650f), 80f, 80f, paint)
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 3f
                  paint.color = Color.argb(90, 255, 255, 255)
                  canvas.drawRoundRect(RectF(40f, 30f, 560f, 650f), 80f, 80f, paint)
                  paint.style = Paint.Style.FILL

                  // Header & Buddy Switch Pill
                  paint.color = Color.argb(55, 255, 255, 255)
                  canvas.drawRoundRect(RectF(190f, 58f, 410f, 102f), 30f, 30f, paint)
                  paint.color = Color.WHITE
                  paint.textSize = 24f
                  paint.textAlign = Paint.Align.CENTER
                  canvas.drawText(timeLabel, 300f, 88f, paint)
                  canvas.drawText("🔄$buddy", 495f, 88f, paint)

                  // 3. 3D Cup Dimensions & Rising Water
                  val glassRect = RectF(165f, 135f, 435f, 495f)
                  val fillRatio = (cups.coerceAtMost(8) / 8f)
                  val waterTop = glassRect.bottom - (glassRect.height() * 0.86f * fillRatio)

                  paint.shader = LinearGradient(glassRect.left, 0f, glassRect.right, 0f,
                      Color.argb(65, 255, 255, 255), Color.argb(20, 255, 255, 255), Shader.TileMode.CLAMP)
                  canvas.drawRoundRect(glassRect, 55f, 55f, paint)
                  paint.shader = null

                  if (cups > 0) {
                      canvas.save()
                      val clipPath = Path().apply { addRoundRect(glassRect, 55f, 55f, Path.Direction.CW) }
                      canvas.clipPath(clipPath)
                      paint.shader = LinearGradient(0f, waterTop, 0f, glassRect.bottom,
                          Color.parseColor("#38BDF8"), Color.parseColor("#0284C7"), Shader.TileMode.CLAMP)
                      canvas.drawRect(glassRect.left, waterTop, glassRect.right, glassRect.bottom, paint)
                      paint.shader = null

                      // 3D Water Meniscus Surface Ring
                      paint.color = Color.argb(140, 186, 230, 253)
                      canvas.drawOval(RectF(glassRect.left + 6f, waterTop - 12f, glassRect.right - 6f, waterTop + 12f), paint)

                      // Floating Fruit & Ice Garnishes
                      paint.textSize = 40f
                      garnishes.forEachIndexed { i, g ->
                          val gx = glassRect.left + 45f + ((i * 52) % 175)
                          val gy = (waterTop + 55f + ((i * 42) % 160)).coerceAtMost(glassRect.bottom - 28f)
                          canvas.drawText(g, gx, gy, paint)
                      }
                      canvas.restore()
                  }

                  // 4. Floating Glass Buddy
                  paint.textSize = 58f
                  val buddyY = if (cups == 0) glassRect.bottom - 22f else waterTop - 6f
                  canvas.drawText(buddy, 300f, buddyY, paint)

                  // 5. 3D Specular Glass Highlights & Rim
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 7f
                  paint.color = Color.argb(190, 255, 255, 255)
                  canvas.drawRoundRect(glassRect, 55f, 55f, paint)
                  paint.style = Paint.Style.FILL
                  paint.color = Color.argb(110, 255, 255, 255)
                  canvas.drawRoundRect(RectF(186f, 165f, 206f, 440f), 14f, 14f, paint)
                  paint.color = Color.argb(60, 255, 255, 255)
                  canvas.drawRoundRect(RectF(402f, 185f, 412f, 430f), 8f, 8f, paint)

                  // 6. Cute Expressive Glass Eyes
                  paint.color = Color.WHITE
                  paint.textSize = 36f
                  paint.setShadowLayer(8f, 0f, 4f, Color.argb(140, 0, 0, 0))
                  val face = when {
                      justReset && cups == 0 -> "( ✧ ∇ ✧ ) 🫧"
                      cups >= 8 -> "( ★ ω ★ ) 🎉"
                      cups == 0 -> "( ◕ ‿ ◕ ) 💧"
                      hoursSince >= 2.5 -> "( ；´Д｀) 💦"
                      else -> "( ≧ ◡ ≦ ) ✨"
                  }
                  canvas.drawText(face, 300f, 305f, paint)
                  paint.clearShadowLayer()

                  // 7. Counter & Midnight Status
                  paint.textSize = 44f
                  paint.typefac